[package]
name = "lumina-inference"
version = "0.1.26"
edition = "2021"
rust-version = "1.75"
description = "High-performance distributed inference engine"
license = "MIT"
repository = "https://github.com/Stanley03-arch/Lumina-Inference"
readme = "README.md"
keywords = ["inference", "ml", "onnx", "grpc", "distributed"]
categories = ["science", "asynchronous"]

[features]
default = []
onnx = ["dep:ort"]
grpc = ["dep:tonic", "dep:prost", "dep:tonic-reflection"]
mdns = ["dep:mdns-sd"]

[dependencies]
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hashbrown = "=0.14.5"
indexmap = "=2.2.6"
ort = { version = "2.0.0-rc.15", optional = true, default-features = true }
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
tonic-reflection = { version = "0.12", optional = true }
mdns-sd = { version = "0.11", optional = true }

[build-dependencies]
tonic-build = "0.12"

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "lumina"
path = "src/main.rs"
