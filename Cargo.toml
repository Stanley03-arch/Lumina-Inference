[package]
name = "lumina-inference"
version = "0.1.1"
edition = "2021"
description = "High-performance distributed inference engine"
license = "MIT"
repository = "https://github.com/Stanley03-arch/Lumina-Inference"
readme = "README.md"
keywords = ["inference", "ml", "onnx", "grpc", "distributed"]
categories = ["science", "asynchronous"]

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "lumina"
path = "src/main.rs"
